version = 1
runner_managed_externally = true
state_dir = "$HOME/.local/state/belter-handoff"
poll_seconds = 60
settle_seconds = 120
restart_cooldown_seconds = 600
gitlab_host = "gitlab.example.com"
glab = "glab"
podman = "podman"
runner_id = 123
project_ids = [456]
runner_binary = "gitlab-runner"
runner_config = "$HOME/.gitlab-runner/config.toml"
runner_name = "local-podman-runner"
compose_project = "optional"
admission_command = ["python3", "<host_policy>/budget.py", "--"]
# Opt in only when the host policy validates bounded single-job CI at warning pressure.
# runner_admission_command = ["python3", "<host_policy>/budget.py", "--ci-runner", "--"]
health_command = ["python3", "<host_policy>/protected-health.py"]
start_command = ["podman-compose", "-p", "optional", "-f", "<config_dir>/compose.yml", "up", "-d", "--no-build", "--pull", "never"]
stop_command = ["podman-compose", "-p", "optional", "-f", "<config_dir>/compose.yml", "down"]
